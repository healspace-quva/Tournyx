<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Signature Capture</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151a28;
            --accent: #00f2ff;
            --text-color: #ffffff;
            --border-color: rgba(0, 242, 255, 0.2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .signature-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 540px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h2 {
            margin: 0 0 8px 0;
            font-size: 1.25rem;
        }

        p {
            margin: 0 0 16px 0;
            color: #8b9bb4;
            font-size: 0.875rem;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 6px;
            color: #8b9bb4;
            text-transform: uppercase;
            font-weight: 600;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            box-sizing: border-box;
        }

        .canvas-container {
            position: relative;
            background: #ffffff;
            border-radius: 10px;
            overflow: hidden;
            touch-action: none;
            border: 2px dashed rgba(255, 255, 255, 0.2);
        }

        canvas {
            display: block;
            width: 100%;
            height: 180px;
            cursor: crosshair;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        button {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .btn-clear {
            background: transparent;
            border-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .btn-clear:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .btn-submit {
            background: var(--accent);
            color: #000000;
        }

        .btn-submit:hover {
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #statusMessage {
            margin-top: 12px;
            font-size: 0.85rem;
            text-align: center;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="signature-card">
    <h2>Digital Signature Capture</h2>
    <p>Sign on the pad below to register your official signature asset.</p>

    <div class="input-group">
        <label for="officerSelect">Signee / Officer</label>
        <select id="officerSelect">
            <option value="officer_ceo">Founder & CEO</option>
            <option value="officer_hr">HR / Coordinator</option>
            <option value="officer_domain">Domain Officer</option>
        </select>
    </div>

    <div class="canvas-container">
        <canvas id="signatureCanvas"></canvas>
    </div>

    <div class="controls">
        <button type="button" class="btn-clear" id="btnClear">Clear</button>
        <button type="button" class="btn-submit" id="btnUpload">Upload Signature</button>
    </div>

    <div id="statusMessage"></div>
</div>

<script>
    const canvas = document.getElementById('signatureCanvas');
    const ctx = canvas.getContext('2d');
    const btnClear = document.getElementById('btnClear');
    const btnUpload = document.getElementById('btnUpload');
    const officerSelect = document.getElementById('officerSelect');
    const statusMsg = document.getElementById('statusMessage');

    let isDrawing = false;
    let hasDrawn = false;

    // Handle Retina/High-DPI scaling for sharp curves
    function resizeCanvas() {
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        canvas.width = canvas.offsetWidth * ratio;
        canvas.height = canvas.offsetHeight * ratio;
        ctx.scale(ratio, ratio);

        ctx.strokeStyle = '#0d111a'; // Signature ink color
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function getCoordinates(e) {
        const rect = canvas.getBoundingClientRect();
        if (e.touches && e.touches.length > 0) {
            return {
                x: e.touches[0].clientX - rect.left,
                y: e.touches[0].clientY - rect.top
            };
        }
        return {
            x: e.clientX - rect.left,
            y: e.clientY - rect.top
        };
    }

    function startDrawing(e) {
        isDrawing = true;
        hasDrawn = true;
        const { x, y } = getCoordinates(e);
        ctx.beginPath();
        ctx.moveTo(x, y);
        e.preventDefault();
    }

    function draw(e) {
        if (!isDrawing) return;
        const { x, y } = getCoordinates(e);
        ctx.lineTo(x, y);
        ctx.stroke();
        e.preventDefault();
    }

    function stopDrawing() {
        if (!isDrawing) return;
        isDrawing = false;
        ctx.closePath();
    }

    // Pointer event listeners (supports mouse & touch seamlessly)
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDrawing);

    canvas.addEventListener('touchstart', startDrawing, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    window.addEventListener('touchend', stopDrawing);

    // Clear canvas
    btnClear.addEventListener('click', () => {
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        ctx.clearRect(0, 0, canvas.width / ratio, canvas.height / ratio);
        hasDrawn = false;
        statusMsg.innerText = '';
    });

    // Upload directly to Supabase Storage from the browser canvas
canvas.toBlob(async (blob) => {
    const officerId = document.getElementById('officerSelect').value;
    const filePath = `officers/${officerId}_${Date.now()}.png`;

    const { data, error } = await supabase.storage
        .from('signatures')
        .upload(filePath, blob, { contentType: 'image/png', upsert: true });

    if (error) {
        alert('Upload failed: ' + error.message);
        return;
    }

    // Get the permanent public URL
    const { data: publicUrlData } = supabase.storage
        .from('signatures')
        .getPublicUrl(filePath);

    const signatureUrl = publicUrlData.publicUrl;

    // Update your database table with the URL
    await supabase
        .from('tims_intern_certificates')
        .update({ signature_url: signatureUrl })
        .eq('domain_officer', officerId);

    alert('Signature uploaded and saved directly to Supabase!');
}, 'image/png');
</script>

</body>
</html>
