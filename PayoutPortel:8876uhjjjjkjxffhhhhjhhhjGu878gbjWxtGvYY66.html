<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tournyx Payout Portal</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --bg-main: #05020c; --bg-panel: rgba(15, 7, 30, 0.7);
            --accent-cyan: #00f2ff; --accent-purple: #bd00ff;
            --accent-red: #ff4d4d; --accent-green: #00ff7f;
            --font-head: 'Orbitron', sans-serif; --font-body: 'Rajdhani', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-main); color: white; font-family: var(--font-body); min-height: 100vh; overflow-x: hidden; }
        
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at 50% 0%, #120529 0%, #05020c 100%); }

        .panel-container { width: 90%; max-width: 500px; margin: 30px auto; background: var(--bg-panel); border: 1px solid rgba(0, 242, 255, 0.15); border-radius: 12px; padding: 25px 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); backdrop-filter: blur(10px); animation: slideUp 0.4s ease-out; }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .header-section { text-align: center; margin-bottom: 20px; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 15px;}
        .header-section h1 { font-family: var(--font-head); font-size: 1.4rem; background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px;}
        .header-desc { color: #888; font-size: 0.7rem; text-transform: uppercase; margin-top: 4px; font-weight: bold; letter-spacing: 1px;}

        .input-box { width: 100%; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 12px; border-radius: 8px; font-family: var(--font-body); font-size: 0.9rem; font-weight: bold; outline: none; transition: 0.3s; margin-bottom: 12px;}
        .input-box:focus { border-color: var(--accent-cyan); box-shadow: 0 0 10px rgba(0,242,255,0.2); }
        
        select.input-box { appearance: none; -webkit-appearance: none; cursor: pointer; color: var(--accent-cyan); }
        select.input-box option { background: #0a0514; color: white; }

        .btn { width: 100%; padding: 12px; border-radius: 8px; font-family: var(--font-head); font-weight: 900; font-size: 0.85rem; text-transform: uppercase; cursor: pointer; border: none; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 8px; letter-spacing: 1px;}
        .btn-primary { background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan)); color: white; box-shadow: 0 4px 12px rgba(0,242,255,0.2); }
        .btn-primary:active { transform: scale(0.97); }
        .btn-success { background: var(--accent-green); color: black; }
        .btn-outline { background: transparent; border: 1px solid var(--accent-cyan); color: var(--accent-cyan); }

        .queue-item { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; }
        .queue-item:hover { border-color: var(--accent-cyan); }

        .info-card { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; margin-bottom: 10px;}
        .info-card label { display: block; color: var(--accent-cyan); font-family: var(--font-head); font-size: 0.65rem; font-weight: bold; margin-bottom: 2px;}
        .info-card span { font-size: 0.95rem; font-weight: 700; color: white; word-break: break-all;}

        #toast { position: fixed; top: 20px; right: 50%; transform: translateX(50%) translateY(-150%); background: rgba(10,5,20,0.95); border: 1px solid var(--accent-cyan); color: white; padding: 10px 20px; border-radius: 20px; font-family: var(--font-head); font-weight: bold; transition: 0.4s; z-index: 9999; font-size: 0.75rem; text-align: center; white-space: nowrap;}
        #toast.show { transform: translateX(50%) translateY(0); }
        
        .hidden { display: none !important; }

        /* INVOICE ENGINE */
        #pdfWrapper { position: absolute; left: -9999px; top: 0; width: 600px; z-index: -9999; background: #05020c; color: white; padding: 30px; box-sizing: border-box; border: 2px solid #00f2ff;}
        .pdf-hdr { border-bottom: 1px dashed rgba(255,255,255,0.2); padding-bottom: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;}
        
        /* SUCCESS ANIMATION */
        .success-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.4s;}
        .success-overlay.active { opacity: 1; pointer-events: all; }
        .success-circle { width: 80px; height: 80px; border-radius: 50%; background: var(--accent-green); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 30px var(--accent-green); font-size: 2.5rem; color: black; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); margin-bottom: 15px;}
        @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>
    <div id="toast">Alert</div>

    <!-- SUCCESS OVERLAY -->
    <div class="success-overlay" id="successOverlay">
        <div class="success-circle"><i class="fa-solid fa-check"></i></div>
        <h2 style="font-family: var(--font-head); color: white; font-size: 1.2rem; letter-spacing: 1px;">SETTLEMENT SUCCESS</h2>
        <p style="color: #aaa; font-size: 0.8rem; margin-top: 5px;">Invoice PDF Saved to Drive</p>
    </div>

    <!-- VIEW 1: LOGIN -->
    <div id="view-login" class="panel-container">
        <div class="header-section">
            <h1>AGENT PORTAL</h1>
            <p class="header-desc">Secure Payout Gateway</p>
        </div>
        <input type="email" id="agentEmail" class="input-box" placeholder="Agent Email (No @gmail.com)">
        <input type="password" id="agentPassword" class="input-box" placeholder="Password">
        <button class="btn btn-primary" id="loginBtn" onclick="portal.login()">
            <span>AUTHORIZE</span> <i class="fa-solid fa-shield-halved"></i>
        </button>
    </div>

    <!-- VIEW 2: QUEUE -->
    <div id="view-dashboard" class="panel-container hidden">
        <div class="header-section" style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px;">
            <div style="text-align: left;">
                <h1 style="font-size: 1.2rem;">QUEUE</h1>
                <p id="agentTag" style="color:var(--accent-cyan); font-weight: bold; font-size: 0.65rem;"></p>
            </div>
            <button class="btn btn-outline" style="width: auto; padding: 6px 10px; font-size: 0.65rem;" onclick="portal.logout()"><i class="fa-solid fa-power-off"></i></button>
        </div>
        <div id="transactionQueueArea" style="max-height: 60vh; overflow-y: auto; padding-right: 5px;"></div>
    </div>

    <!-- VIEW 3: DISPATCH -->
    <div id="view-dispatch" class="panel-container hidden">
        <div class="header-section" style="text-align: left; padding-bottom: 10px; border-bottom: none; margin-bottom: 10px;">
            <button class="btn btn-outline" style="width:auto; padding: 5px 10px; font-size:0.65rem; margin-bottom:10px;" onclick="portal.switchView('dashboard')"><i class="fa-solid fa-arrow-left"></i> Back</button>
            <h1 id="dispatchTitle" style="font-size: 1.2rem;">DISPATCH</h1>
        </div>

        <div class="info-card"><label>Target Account</label><span id="dispEmail">-</span></div>
        <div class="info-card"><label>Payout Amount</label><span id="dispAmt" style="color:var(--accent-green); font-size:1.4rem;">₹0</span></div>
        <div class="info-card"><label>Given Payment Details</label><span id="dispDetails" style="color:var(--accent-purple);">-</span></div>

        <button class="btn btn-success" id="payNowBtn" style="margin-bottom: 20px;" onclick="portal.executeUpiDeepLink()">
            <i class="fa-solid fa-bolt"></i> OPEN UPI APP
        </button>

        <div style="border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 15px;">
            <label style="display:block; margin-bottom:6px; font-family:var(--font-head); font-size:0.75rem; color:var(--accent-cyan);">SETTLEMENT VERDICT</label>
            <select id="dispatchStatusDropdown" class="input-box">
                <option value="" disabled selected>Select Status...</option>
                <!-- EXACT VALUES AS REQUESTED -->
                <option value="Success">Success</option>
                <option value="Failed">Failed</option>
                <option value="Refunded">Refunded</option>
            </select>
            <button class="btn btn-primary" id="commitBtn" onclick="portal.submitStatusResolution()">
                <span>COMMIT DECISION</span> <i class="fa-solid fa-check-double"></i>
            </button>
        </div>
    </div>

    <!-- INVOICE TEMPLATE (HIDDEN) -->
    <div id="pdfWrapper">
        <div class="pdf-hdr">
            <div>
                <h1 style="font-size:18px; font-weight:900; letter-spacing:1px; color:#ffffff; margin:0;">TOURNYX ESPORTS</h1>
                <p style="color:#888; font-size:9px; margin-top:2px;">OFFICIAL SETTLEMENT INVOICE</p>
            </div>
            <div style="text-align:right; font-family:monospace; font-size:10px; color:#00f2ff;" id="pdf-date">DATE</div>
        </div>
        <div style="background:rgba(255,255,255,0.05); padding:12px; border-radius:6px; margin-bottom:20px; font-size:11px; line-height:1.8;">
            <div><strong>Txn ID:</strong> <span id="pdf-txnid" style="color:var(--accent-cyan); font-family:monospace;">-</span></div>
            <div><strong>User Email:</strong> <span id="pdf-email">-</span></div>
            <div><strong>Payment Details:</strong> <span id="pdf-dest">-</span></div>
            <div><strong>Processed By:</strong> Tournyx Esports [<span id="pdf-agent" style="color:#00ff7f;">-</span>]</div>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(0,255,127,0.1); padding:12px; border-radius:6px; border:1px solid var(--accent-green);">
            <span style="font-weight:bold; font-size:10px;">NET DISBURSAL</span>
            <strong style="font-size:18px; color:var(--accent-green);" id="pdf-amount">₹0</strong>
        </div>
    </div>

    <script>
        // 🚨 YOUR API URL
        const SYSTEM_URL = "https://script.google.com/macros/s/AKfycbyqqTpgaflxKJ9xH0jq7mJ_jLzcoNhas3gNo0h5gvoa_6r5Ae9NFxJAJp7ZoYNnMRKl/exec";

        const portal = {
            agent: null,
            pollingTimer: null,
            activeTxn: null,

            init: function() { this.initBG(); },

            toast: function(msg) {
                const t = document.getElementById('toast'); t.innerText = msg;
                t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000);
            },

            switchView: function(viewId) {
                document.querySelectorAll('.panel-container').forEach(el => el.classList.add('hidden'));
                document.getElementById(`view-${viewId}`).classList.remove('hidden');
            },

            btnLoading: function(btnId, isLoading, originalText) {
                const btn = document.getElementById(btnId);
                if(isLoading) {
                    btn.disabled = true;
                    btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Processing...`;
                } else {
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            },

            api: async function(action, data = {}) {
                data.action = action;
                try {
                    const res = await fetch(SYSTEM_URL, { method: 'POST', body: JSON.stringify(data) });
                    return await res.json();
                } catch(err) {
                    return { success: false, message: "Server Connection Failed." };
                }
            },

            login: async function() {
                const e = document.getElementById('agentEmail').value.trim();
                const p = document.getElementById('agentPassword').value.trim();
                if(!e || !p) return this.toast("Enter credentials.");

                this.btnLoading('loginBtn', true);
                const res = await this.api('agent_login', { email: e, password: p });
                this.btnLoading('loginBtn', false, `<span>AUTHORIZE</span> <i class="fa-solid fa-shield-halved"></i>`);

                if(res.success) {
                    this.agent = res.data.agent;
                    document.getElementById('agentTag').innerText = `AGENT: ${this.agent}`;
                    this.switchView('dashboard');
                    this.startLiveQueueSync();
                } else {
                    this.toast(res.message);
                }
            },

            logout: function() {
                clearInterval(this.pollingTimer);
                this.agent = null;
                document.getElementById('agentPassword').value = "";
                this.switchView('login');
            },

            startLiveQueueSync: function() {
                this.syncQueue();
                this.pollingTimer = setInterval(() => this.syncQueue(), 3000); 
            },

            syncQueue: async function() {
                const res = await this.api('get_pending');
                if(!res.success) return;

                const area = document.getElementById('transactionQueueArea');
                area.innerHTML = "";

                if(res.data.length === 0) {
                    area.innerHTML = `<div style="text-align:center; padding:30px; color:#555; font-size:0.8rem; font-weight:bold;">NO PENDING PAYOUTS</div>`;
                    return;
                }

                res.data.forEach(t => {
                    let card = document.createElement('div');
                    card.className = `queue-item`;
                    card.innerHTML = `
                        <div style="min-width:0; overflow:hidden;">
                            <h3 style="font-family:var(--font-head); font-size:0.85rem; color:#fff;">${t.txnId}</h3>
                            <p style="font-size:0.7rem; color:#888; font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${t.details}</p>
                        </div>
                        <div style="text-align:right; flex-shrink:0;">
                            <span style="font-family:var(--font-head); font-size:1rem; font-weight:900; color:var(--accent-green); display:block;">₹${t.amount}</span>
                            <button class="btn btn-outline" style="padding:4px 10px; font-size:0.65rem; margin-top:4px;" onclick="portal.claimTxn('${t.txnId}', '${t.email}', ${t.amount}, '${t.method}', '${t.details}')">SELECT</button>
                        </div>
                    `;
                    area.appendChild(card);
                });
            },

            claimTxn: function(txnId, email, amount, method, details) {
                this.activeTxn = { txnId, email, amount, method, details };
                
                document.getElementById('dispatchTitle').innerText = `ID: ${txnId}`;
                document.getElementById('dispEmail').innerText = email;
                document.getElementById('dispAmt').innerText = `₹${amount}`;
                document.getElementById('dispDetails').innerText = details;
                document.getElementById('dispatchStatusDropdown').value = "";

                // PERFECT UPI EXTRACTION
                const payBtn = document.getElementById('payNowBtn');
                if(method.toLowerCase() === 'upi' || details.includes('@')) {
                    payBtn.classList.remove('hidden');
                } else {
                    payBtn.classList.add('hidden');
                }
                this.switchView('dispatch');
            },

            executeUpiDeepLink: function() {
                if(!this.activeTxn) return;
                
                // Bulletproof regex to scrape just the UPI ID out of the text
                let upiMatch = this.activeTxn.details.match(/[a-zA-Z0-9.\-_]{2,256}@[a-zA-Z]{2,64}/);
                let cleanUpi = upiMatch ? upiMatch[0] : this.activeTxn.details.replace('A/C:', '').trim();
                
                let upiUri = `upi://pay?pa=${encodeURIComponent(cleanUpi)}&pn=Tournyx%20Esports&am=${this.activeTxn.amount}&tn=${encodeURIComponent(this.activeTxn.txnId)}&cu=INR`;
                window.location.href = upiUri;
            },

            submitStatusResolution: async function() {
                const val = document.getElementById('dispatchStatusDropdown').value;
                if(!val) return this.toast("Select Status!");

                this.btnLoading('commitBtn', true);
                
                const res = await this.api('update_status', {
                    txnId: this.activeTxn.txnId,
                    status: val,
                    agentEmail: this.agent
                });

                if(res.success) {
                    if(val === "Success") {
                        await this.generateAndUploadPDF();
                    }
                    this.toast("Updated!");
                    this.btnLoading('commitBtn', false, `<span>COMMIT DECISION</span> <i class="fa-solid fa-check-double"></i>`);
                    this.activeTxn = null;
                    this.switchView('dashboard');
                } else {
                    this.toast(res.message);
                    this.btnLoading('commitBtn', false, `<span>COMMIT DECISION</span> <i class="fa-solid fa-check-double"></i>`);
                }
            },

            generateAndUploadPDF: async function() {
                // Fill PDF
                document.getElementById('pdf-date').innerText = new Date().toLocaleDateString('en-GB');
                document.getElementById('pdf-txnid').innerText = this.activeTxn.txnId;
                document.getElementById('pdf-email').innerText = this.activeTxn.email;
                document.getElementById('pdf-dest').innerText = this.activeTxn.details;
                document.getElementById('pdf-agent').innerText = this.agent;
                document.getElementById('pdf-amount').innerText = `₹${this.activeTxn.amount}`;

                const element = document.getElementById('pdfWrapper');
                const opt = { margin: 0.2, filename: `Tournyx_${this.activeTxn.txnId}.pdf`, image: { type: 'jpeg', quality: 1 }, html2canvas: { scale: 2, backgroundColor: '#05020c' }, jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' } };
                
                // Get Base64 & Upload
                const pdfBase64 = await html2pdf().set(opt).from(element).outputPdf('datauristring');
                
                // Show Success Screen instantly
                const overlay = document.getElementById('successOverlay');
                overlay.classList.add('active');
                setTimeout(() => overlay.classList.remove('active'), 2500);

                // Download locally for the agent
                html2pdf().set(opt).from(element).save();

                // Send to Drive
                await this.api('upload_invoice', { txnId: this.activeTxn.txnId, pdfBase64: pdfBase64 });
            },

            initBG: function() {
                const c = document.getElementById('bg-canvas'); const ctx = c.getContext('2d');
                c.width = window.innerWidth; c.height = window.innerHeight;
                let arr = [];
                class Node {
                    constructor(){ this.x = Math.random()*c.width; this.y = Math.random()*c.height; this.s = Math.random()*1.5; this.v = (Math.random()*0.3) + 0.1; }
                    update(){ this.y -= this.v; if(this.y < 0) this.y = c.height; }
                    draw(){ ctx.fillStyle = '#00f2ff'; ctx.globalAlpha = 0.2; ctx.beginPath(); ctx.arc(this.x, this.y, this.s, 0, Math.PI*2); ctx.fill(); }
                }
                for(let i=0; i<20; i++) arr.push(new Node());
                function loop(){ ctx.clearRect(0,0,c.width,c.height); arr.forEach(n => { n.update(); n.draw(); }); requestAnimationFrame(loop); }
                loop();
            }
        };

        portal.init();
    </script>
</body>
</html>
