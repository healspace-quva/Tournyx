<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b0814">
    <title>Server Maintenance - Tournyx</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Tournyx Brand Palette */
            --tx-bg: #0b0814;
            --tx-purple: #a855f7;
            --tx-purple-glow: rgba(168, 85, 247, 0.5);
            --tx-cyan: #00e5ff;
            --tx-cyan-glow: rgba(0, 229, 255, 0.5);
            --tx-panel: rgba(18, 15, 30, 0.75);
            --font-head: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            width: 100%; height: 100dvh; /* Force single view */
            overflow: hidden; /* No scrolling allowed */
            background-color: var(--tx-bg); color: #ffffff;
            font-family: var(--font-body);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* --- 1. VIDEO BACKGROUND --- */
        .video-bg {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100dvh; object-fit: cover; z-index: -3; filter: brightness(0.2) blur(3px);
        }
        .grid-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100dvh; z-index: -2;
            background: linear-gradient(rgba(168, 85, 247, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(168, 85, 247, 0.05) 1px, transparent 1px);
            background-size: 30px 30px; pointer-events: none;
        }

        /* --- 2. TOP HUD (Logo & Timer) --- */
        .hud-header {
            position: absolute; top: 0; left: 0; width: 100%; padding: clamp(10px, 3vh, 20px) 20px;
            display: flex; justify-content: space-between; align-items: flex-start; z-index: 10;
        }
        .hud-logo {
            width: clamp(40px, 12vw, 60px); height: clamp(40px, 12vw, 60px);
            background: url('https://i.ibb.co/L5hY8gW/1000093706.png') center/contain no-repeat; /* Tournyx Logo */
            filter: drop-shadow(0 0 10px var(--tx-purple));
        }
        .hud-timer {
            background: rgba(0,0,0,0.6); border: 1px solid var(--tx-cyan); border-radius: 8px;
            padding: 8px 12px; display: flex; gap: 8px; align-items: center;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2); backdrop-filter: blur(10px);
        }
        .time-block { text-align: center; }
        .time-block span { display: block; font-family: var(--font-head); font-size: clamp(1rem, 4vw, 1.3rem); font-weight: 700; color: #fff; line-height: 1; }
        .time-block label { font-size: 0.6rem; color: var(--tx-cyan); text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }
        .time-colon { font-family: var(--font-head); font-size: 1.2rem; color: var(--tx-purple); font-weight: 900; margin-top: -8px;}

        /* --- 3. MAIN CENTER CONTAINER --- */
        .main-container {
            width: 100%; max-width: 600px; padding: 0 20px; display: flex; flex-direction: column; align-items: center; gap: clamp(15px, 3vh, 25px); z-index: 5;
        }

        /* 16:9 Auto-Sliding Banner */
        .banner-carousel {
            width: 100%; aspect-ratio: 16/9; max-height: 25vh; /* Prevents overflow */
            background: #000; border-radius: 12px; border: 1px solid var(--tx-purple);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px var(--tx-purple-glow);
            overflow: hidden; position: relative; flex-shrink: 0;
        }
        .slider-track { display: flex; width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
        .slide { min-width: 100%; height: 100%; position: relative; }
        .slide img { width: 100%; height: 100%; object-fit: cover; }
        .slide-overlay { position: absolute; bottom: 0; left: 0; width: 100%; padding: 10px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); font-family: var(--font-head); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px;}
        
        /* Dynamic Status Text */
        .status-wrapper { text-align: center; }
        .glitch-text {
            font-family: var(--font-head); font-size: clamp(1.8rem, 7vw, 2.8rem); font-weight: 900;
            text-transform: uppercase; background: linear-gradient(90deg, var(--tx-purple), var(--tx-cyan));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.4); letter-spacing: 2px; line-height: 1.1;
        }
        .sub-status { font-size: clamp(0.8rem, 3.5vw, 1rem); color: #8a93a0; text-transform: uppercase; letter-spacing: 2px; margin-top: 5px; font-weight: 600; }

        /* Highlighted Play Button */
        .play-btn-wrapper { width: 100%; display: flex; justify-content: center; position: relative; margin-top: 10px; }
        .play-btn {
            background: linear-gradient(45deg, #7c3aed, #06b6d4);
            border: none; border-radius: 50px; padding: clamp(15px, 3vh, 20px) clamp(30px, 8vw, 50px);
            color: #fff; font-family: var(--font-head); font-weight: 900; font-size: clamp(1rem, 4vw, 1.2rem);
            text-transform: uppercase; letter-spacing: 2px; cursor: pointer;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.6), inset 0 0 10px rgba(255,255,255,0.3);
            animation: pulseBtn 2s infinite; display: flex; align-items: center; gap: 12px; transition: transform 0.2s;
        }
        .play-btn:active { transform: scale(0.95); }
        .play-btn i { font-size: 1.4rem; }
        @keyframes pulseBtn { 0% { box-shadow: 0 0 15px rgba(168, 85, 247, 0.6); } 50% { box-shadow: 0 0 35px rgba(0, 229, 255, 0.8); } 100% { box-shadow: 0 0 15px rgba(168, 85, 247, 0.6); } }

        /* --- 4. BOTTOM FOOTER --- */
        .hud-footer {
            position: absolute; bottom: clamp(15px, 4vh, 30px); left: 0; width: 100%;
            display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 10;
        }
        
        /* Fading Messages */
        .fade-messages { position: relative; height: 20px; width: 100%; display: flex; justify-content: center; align-items: center; }
        .fade-msg {
            position: absolute; font-family: var(--font-body); font-size: clamp(0.75rem, 3vw, 0.9rem);
            color: #a0aabf; text-transform: uppercase; letter-spacing: 1.5px; opacity: 0; font-weight: 600;
            animation: crossFade 9s infinite; text-align: center; width: 90%;
        }
        .fade-msg:nth-child(1) { animation-delay: 0s; color: var(--tx-cyan); }
        .fade-msg:nth-child(2) { animation-delay: 3s; color: var(--tx-purple); }
        .fade-msg:nth-child(3) { animation-delay: 6s; color: #fff; }
        @keyframes crossFade { 0%, 20% { opacity: 1; transform: translateY(0); } 30%, 100% { opacity: 0; transform: translateY(-10px); } }

        /* Social Icons */
        .social-icons { display: flex; gap: 20px; }
        .social-icons i { font-size: clamp(1.2rem, 5vw, 1.5rem); color: rgba(255,255,255,0.5); transition: 0.3s; cursor: pointer; }
        .social-icons i:hover { color: var(--tx-cyan); filter: drop-shadow(0 0 8px var(--tx-cyan)); transform: translateY(-3px); }

        /* --- 5. POPUP MINI-GAME MODAL --- */
        #gameModal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
            background: rgba(11, 8, 20, 0.9); backdrop-filter: blur(15px); z-index: 999;
            justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s ease;
        }
        #gameModal.show { display: flex; opacity: 1; }
        .modal-content {
            background: var(--tx-panel); border: 1px solid rgba(168, 85, 247, 0.4); border-radius: 20px;
            width: 90%; max-width: 400px; padding: 25px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            position: relative;
        }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; color: #fff; cursor: pointer; opacity: 0.7; }
        
        /* Game Arena */
        .game-title { font-family: var(--font-head); color: var(--tx-cyan); font-size: 1.3rem; margin-bottom: 15px; text-transform: uppercase; }
        .arena {
            width: 100%; height: 250px; background: rgba(0,0,0,0.5); border: 2px dashed var(--tx-purple);
            border-radius: 12px; position: relative; overflow: hidden; margin-bottom: 15px; cursor: crosshair;
        }
        .target {
            position: absolute; width: 40px; height: 40px; background: radial-gradient(circle, #fff 10%, var(--tx-cyan) 20%, transparent 60%);
            border-radius: 50%; display: none; align-items: center; justify-content: center; box-shadow: 0 0 15px var(--tx-cyan);
        }
        .stats-bar { display: flex; justify-content: space-between; font-family: var(--font-head); font-size: 0.9rem; color: #fff; margin-bottom: 15px;}
        
        /* Share Button */
        .share-btn {
            background: #25D366; /* WhatsApp Green vibe */ border: none; border-radius: 8px; width: 100%;
            padding: 12px; color: #fff; font-family: var(--font-head); font-weight: 700; font-size: 1rem;
            text-transform: uppercase; cursor: pointer; display: none; align-items: center; justify-content: center; gap: 10px;
            box-shadow: 0 0 15px rgba(37, 211, 102, 0.4);
        }
        .start-btn {
            background: var(--tx-purple); border: none; border-radius: 8px; width: 100%; padding: 12px;
            color: #fff; font-family: var(--font-head); font-weight: 700; cursor: pointer; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <video class="video-bg" autoplay loop muted playsinline>
        <source src="https://cdn.pixabay.com/video/2020/05/25/40141-425261456_large.mp4" type="video/mp4">
    </video>
    <div class="grid-overlay"></div>

    <div class="hud-header">
        <div class="hud-logo"></div> <div class="hud-timer" id="timerBox">
            <div class="time-block"><span id="t-hrs">00</span><label>HR</label></div>
            <div class="time-colon">:</div>
            <div class="time-block"><span id="t-min">00</span><label>MIN</label></div>
            <div class="time-colon">:</div>
            <div class="time-block"><span id="t-sec">00</span><label>SEC</label></div>
        </div>
    </div>

    <div class="main-container">
        
        <div class="banner-carousel">
            <div class="slider-track" id="sliderTrack">
                <div class="slide">
                    <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=2070&auto=format&fit=crop" alt="Tournyx Update">
                    <div class="slide-overlay">Tournyx v2.0: The Arena Awaits</div>
                </div>
                <div class="slide">
                    <img src="https://images.unsplash.com/photo-1538481199005-c710c4d965fc?q=80&w=2070&auto=format&fit=crop" alt="Esports Sync">
                    <div class="slide-overlay">Syncing Global Leaderboards</div>
                </div>
            </div>
        </div>

        <div class="status-wrapper">
            <h1 class="glitch-text" id="mainStatus">PLATFORM OFFLINE</h1>
            <div class="sub-status" id="subStatus">Deploying Database Upgrades</div>
        </div>

        <div class="play-btn-wrapper">
            <button class="play-btn" onclick="openGame()">
                <i class="fa-solid fa-gamepad"></i> Play & Earn Points
            </button>
        </div>
    </div>

    <div class="hud-footer">
        <div class="fade-messages">
            <span class="fade-msg">Server under maintenance, come back again soon.</span>
            <span class="fade-msg">Optimizing match-making algorithms...</span>
            <span class="fade-msg">Preparing new exclusive daily quests.</span>
        </div>
        
        <div class="social-icons">
            <i class="fa-brands fa-instagram"></i>
            <i class="fa-brands fa-discord"></i>
            <i class="fa-brands fa-twitter"></i>
            <i class="fa-brands fa-youtube"></i>
        </div>
    </div>

    <div id="gameModal">
        <div class="modal-content">
            <i class="fa-solid fa-xmark close-modal" onclick="closeGame()"></i>
            <h2 class="game-title">Tournyx Aim Rush</h2>
            
            <div class="stats-bar">
                <div>Time: <span id="g-time" style="color:var(--tx-cyan)">10</span>s</div>
                <div>Score: <span id="g-score" style="color:var(--tx-purple)">0</span></div>
            </div>

            <div class="arena" id="arena" onclick="missClick()">
                <div class="target" id="target" onclick="hitTarget(event)"></div>
            </div>

            <button class="start-btn" id="startBtn" onclick="startGame()">Start Challenge</button>
            <button class="share-btn" id="shareBtn" onclick="shareRewards()">
                <i class="fa-brands fa-whatsapp"></i> Share & Double Points
            </button>
            <div id="winMsg" style="display:none; color:#00e5ff; font-family:var(--font-head); margin-top:10px; font-size:0.9rem;"></div>
        </div>
    </div>

    <script>
        // --- 1. JSON LOGIC & TIMER ENGINE ---
        // Emulating the maintenance.json data
        const maintenanceJSON = {
            "maintenance_active": true,
            "end_time": "July 12, 2026 18:00:00 GMT+0530" 
        };

        const targetDate = new Date(maintenanceJSON.end_time).getTime();
        
        function updateTimer() {
            const now = new Date().getTime();
            const diff = targetDate - now;

            if (diff <= 0) {
                // Time is up -> Trigger "Entering Soon!!" State
                document.getElementById('mainStatus').innerText = "ENTERING SOON!!";
                document.getElementById('mainStatus').style.background = "linear-gradient(90deg, #00e5ff, #00ff88)";
                document.getElementById('mainStatus').style.webkitBackgroundClip = "text";
                document.getElementById('mainStatus').style.textShadow = "0 0 20px rgba(0, 229, 255, 0.6)";
                document.getElementById('subStatus').innerText = "Waking up the servers...";
                
                // Hide timer entirely as requested
                document.getElementById('timerBox').style.display = "none";
                return;
            }

            // Normal Countdown
            let h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            let m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            let s = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('t-hrs').innerText = h < 10 ? '0'+h : h;
            document.getElementById('t-min').innerText = m < 10 ? '0'+m : m;
            document.getElementById('t-sec').innerText = s < 10 ? '0'+s : s;
        }
        setInterval(updateTimer, 1000);
        updateTimer();

        // --- 2. BANNER CAROUSEL ---
        let currentSlide = 0;
        const track = document.getElementById('sliderTrack');
        function autoSlide() {
            currentSlide = (currentSlide === 0) ? 1 : 0; // Toggles between 0 and 1
            track.style.transform = `translateX(-${currentSlide * 100}%)`;
        }
        setInterval(autoSlide, 3500);

        // --- 3. TOURNYX MINI-GAME LOGIC ---
        const modal = document.getElementById('gameModal');
        const arena = document.getElementById('arena');
        const target = document.getElementById('target');
        const startBtn = document.getElementById('startBtn');
        const shareBtn = document.getElementById('shareBtn');
        const winMsg = document.getElementById('winMsg');
        
        let score = 0;
        let timeLeft = 10;
        let gameInterval;
        let isPlaying = false;

        function openGame() { modal.classList.add('show'); }
        function closeGame() { 
            modal.classList.remove('show'); 
            resetGameUI();
        }

        function startGame() {
            score = 0; timeLeft = 10; isPlaying = true;
            document.getElementById('g-score').innerText = score;
            document.getElementById('g-time').innerText = timeLeft;
            startBtn.style.display = "none";
            shareBtn.style.display = "none";
            winMsg.style.display = "none";
            
            spawnTarget();
            gameInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('g-time').innerText = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function spawnTarget() {
            if(!isPlaying) return;
            target.style.display = 'flex';
            const maxX = arena.clientWidth - 40;
            const maxY = arena.clientHeight - 40;
            target.style.left = Math.floor(Math.random() * maxX) + 'px';
            target.style.top = Math.floor(Math.random() * maxY) + 'px';
        }

        function hitTarget(e) {
            e.stopPropagation();
            if(!isPlaying) return;
            if(navigator.vibrate) navigator.vibrate(40); // Tactile hit
            score++;
            document.getElementById('g-score').innerText = score;
            target.style.display = 'none';
            setTimeout(spawnTarget, 200);
        }

        function missClick() {
            if(isPlaying && score > 0) {
                score--; // Penalty for missing
                document.getElementById('g-score').innerText = score;
            }
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            target.style.display = 'none';
            
            if (score >= 5) {
                winMsg.innerText = `Epic! You won ${score * 10} TX Points!`;
                winMsg.style.display = "block";
                shareBtn.style.display = "flex"; // Show share to double
            } else {
                startBtn.innerText = "Try Again (Need 5 Hits)";
                startBtn.style.display = "block";
            }
        }

        function resetGameUI() {
            isPlaying = false; clearInterval(gameInterval);
            target.style.display = 'none';
            startBtn.innerText = "Start Challenge";
            startBtn.style.display = "block";
            shareBtn.style.display = "none";
            winMsg.style.display = "none";
            document.getElementById('g-time').innerText = "10";
            document.getElementById('g-score').innerText = "0";
        }

        // --- 4. VIRAL NATIVE WEB SHARE API ---
        async function shareRewards() {
            const shareData = {
                title: 'Tournyx Esports',
                text: `I just scored ${score * 10} points on the Tournyx Aim Rush! Join me on the arena now! 🏆`,
                url: window.location.href
            };

            if (navigator.share) {
                try {
                    await navigator.share(shareData);
                    winMsg.innerText = "Points Doubled! Successfully added to your vault.";
                    winMsg.style.color = "#a855f7"; // Turn purple on success
                    shareBtn.style.display = "none";
                } catch (err) {
                    console.log('User cancelled share.');
                }
            } else {
                // Fallback for desktop/unsupported browsers
                alert(`Link Copied! Paste it to your friends to double your points!`);
                shareBtn.style.display = "none";
                winMsg.innerText = "Points Doubled!";
            }
        }
    </script>
</body>
</html>
