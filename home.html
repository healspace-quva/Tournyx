    <style>
        /* --- PREMIUM LITE TOURNYX THEME --- */
        :root {
            --bg-void: #07090E;
            --panel-bg: #131826;
            --panel-border: rgba(255, 255, 255, 0.08);
            
            --neon-cyan: #00f2ff;
            --neon-purple: #bd00ff;
            --accent-orange: #ff6600;
            --gold: #FFD700;
            
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --font-head: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }

        body {
            background-color: var(--bg-void);
            color: var(--text-main);
            font-family: var(--font-body);
            height: 100dvh; width: 100vw;
            display: flex; justify-content: center; /* Centers app on desktop */
            overflow: hidden;
        }

        /* --- APP VIEWPORT CONFINEMENT (Perfect Desktop & Mobile Scale) --- */
        .app-container {
            width: 100%; max-width: 480px; /* Locks to mobile app width on PC */
            height: 100%; overflow-y: auto; overflow-x: hidden;
            background-color: var(--bg-void);
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            padding-bottom: 100px;
        }

        /* --- UI SAMPLE: TOP CONTROL PANEL --- */
        .top-nav-matrix { padding: 15px 20px; display: flex; flex-direction: column; gap: 15px; }
        .nav-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        
        .pill-btn {
            background: var(--panel-bg); border: 1px solid var(--panel-border);
            height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
            color: var(--text-main); font-size: 1.1rem; cursor: pointer; transition: 0.3s;
        }
        .pill-btn:active { transform: scale(0.95); }
        .pill-btn.menu { width: 42px; }
        .pill-btn.search { width: 55px; }
        .pill-btn.icon-only { width: 42px; position: relative; }
        
        .badge { position: absolute; top: -5px; right: -5px; background: var(--neon-purple); color: white; font-size: 0.6rem; font-family: var(--font-head); font-weight: bold; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        .currency-pill {
            background: var(--panel-bg); border: 1px solid var(--panel-border);
            height: 42px; border-radius: 25px; padding: 0 12px;
            display: flex; align-items: center; gap: 8px; font-family: var(--font-head); font-size: 0.8rem; font-weight: bold;
        }
        .currency-pill.tickets { border-color: rgba(0, 242, 255, 0.3); box-shadow: inset 0 0 10px rgba(0, 242, 255, 0.1); }
        .currency-pill.gold { border-color: rgba(255, 215, 0, 0.3); box-shadow: inset 0 0 10px rgba(255, 215, 0, 0.1); }

        .profile-pill {
            background: var(--panel-bg); border: 1px solid var(--panel-border);
            height: 42px; border-radius: 25px; padding: 4px 15px 4px 4px;
            display: flex; align-items: center; gap: 10px; cursor: pointer; transition: 0.3s;
        }
        .profile-pill img { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--gold); }
        .profile-text { display: flex; flex-direction: column; justify-content: center; }
        .profile-text b { font-family: var(--font-head); font-size: 0.8rem; line-height: 1; }
        .profile-text span { font-size: 0.65rem; color: var(--text-muted); }

        /* --- THRYL UI: DAILY STREAK --- */
        .thryl-streak-card {
            margin: 5px 20px 20px; display: flex; background: #161A25;
            border-radius: 18px; border: 1px solid rgba(255,255,255,0.05); overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); height: 130px;
        }
        .ts-left {
            background: linear-gradient(180deg, #ff9d00, #ff5500); width: 100px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            position: relative; flex-shrink: 0; padding: 15px; text-align: center;
        }
        .ts-left h1 { font-family: var(--font-head); font-size: 2.2rem; color: white; margin: 0; line-height: 1; text-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .ts-left span { font-size: 0.75rem; color: rgba(255,255,255,0.9); font-weight: bold; margin-top: 2px; line-height: 1.1; }
        .ts-left i { position: absolute; bottom: -10px; right: -5px; font-size: 4.5rem; color: rgba(255,255,255,0.2); pointer-events: none; }

        .ts-right { flex: 1; padding: 15px; display: flex; flex-direction: column; justify-content: center; overflow-x: auto; }
        .ts-head { margin-bottom: 15px; }
        .ts-head h4 { font-family: var(--font-head); font-size: 0.9rem; color: white; margin-bottom: 2px; }
        .ts-head p { font-size: 0.7rem; color: var(--text-muted); }

        .ts-timeline { display: flex; align-items: center; position: relative; gap: 15px; min-width: max-content; }
        .ts-line-bg { position: absolute; top: 12px; left: 15px; right: 15px; height: 3px; background: rgba(255,255,255,0.1); z-index: 0; }
        .ts-line-fill { position: absolute; top: 12px; left: 15px; height: 3px; background: var(--accent-orange); z-index: 1; transition: 1s ease; width: 0%; }
        
        .ts-node { display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 2; }
        .ts-circle { width: 26px; height: 26px; border-radius: 50%; background: #161A25; border: 2px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 0.7rem; color: transparent; }
        .ts-node.claimed .ts-circle { background: var(--accent-orange); border-color: var(--accent-orange); color: white; }
        .ts-node.active .ts-circle { background: rgba(255,102,0,0.2); border-color: var(--accent-orange); color: var(--accent-orange); box-shadow: 0 0 10px rgba(255,102,0,0.4); }
        .ts-val { display: flex; flex-direction: column; align-items: center; }
        .ts-val b { font-size: 0.75rem; color: white; display: flex; align-items: center; gap: 3px; }
        .ts-val span { font-size: 0.6rem; color: var(--text-muted); }

        /* --- SECTION HEADERS --- */
        .section-header { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; margin-bottom: 12px; }
        .section-header h2 { font-family: var(--font-head); font-size: 1.1rem; color: white; }
        .section-header a { font-size: 0.8rem; color: var(--neon-cyan); text-decoration: none; font-weight: bold; }

        /* --- THRYL CARDS (Horizontal Scroll) --- */
        .card-slider { display: flex; gap: 15px; overflow-x: auto; padding: 0 20px 20px; scroll-snap-type: x mandatory; }
        
        .game-card { flex: 0 0 150px; scroll-snap-align: start; border-radius: 16px; overflow: hidden; position: relative; height: 190px; background: var(--panel-bg); cursor: pointer; transition: 0.3s; border: 1px solid var(--panel-border); }
        .game-card:active { transform: scale(0.95); }
        .gc-bg { width: 100%; height: 100%; position: absolute; top: 0; left: 0; object-fit: cover; opacity: 0.6; z-index: 0; transition: 0.3s;}
        .game-card:hover .gc-bg { opacity: 0.8; transform: scale(1.1); }
        .gc-overlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 60%; background: linear-gradient(0deg, rgba(0,0,0,0.9), transparent); z-index: 1; }
        
        .gc-content { position: absolute; top: 0; left: 0; width: 100%; height: 100%; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; z-index: 2; }
        .gc-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .gc-title { font-family: var(--font-head); font-size: 0.95rem; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8); line-height: 1.1;}
        .gc-players { font-size: 0.65rem; color: #ddd; margin-top: 4px; display: flex; align-items: center; gap: 4px; }
        .gc-share { width: 24px; height: 24px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); font-size: 0.7rem; color: white; }
        
        .gc-bottom { display: flex; justify-content: space-between; align-items: flex-end; }
        .gc-stat { display: flex; flex-direction: column; gap: 2px; }
        .gc-stat span { font-size: 0.6rem; color: #bbb; text-transform: uppercase; }
        .gc-stat b { font-family: var(--font-head); font-size: 0.8rem; color: white; display: flex; align-items: center; gap: 4px; }

        /* FEATURED TOURNAMENT CARD */
        .ft-card { flex: 0 0 280px; scroll-snap-align: center; border-radius: 16px; background: #161A25; border: 1px solid var(--panel-border); overflow: hidden; position: relative; }
        .ft-top { padding: 15px; position: relative; z-index: 2;}
        .ft-prize-badge { background: var(--neon-purple); display: inline-block; padding: 4px 10px; border-radius: 6px; font-family: var(--font-head); font-size: 0.8rem; font-weight: bold; margin-bottom: 10px; box-shadow: 0 0 10px rgba(189,0,255,0.5);}
        .ft-title { font-family: var(--font-head); font-size: 1rem; margin-bottom: 10px; line-height: 1.2; }
        .ft-org { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 10px;}
        .ft-org img { width: 20px; height: 20px; border-radius: 50%; }
        .ft-tags { display: flex; gap: 10px; font-size: 0.7rem; color: #888; font-weight: bold; }
        
        .ft-art { position: absolute; right: 0; bottom: 45px; width: 100px; height: 100px; object-fit: contain; opacity: 0.8; z-index: 1;}
        
        .ft-bottom { display: flex; background: rgba(0,0,0,0.4); border-top: 1px solid rgba(255,255,255,0.05); z-index: 2; position: relative;}
        .ft-status { flex: 1; padding: 12px; font-size: 0.75rem; color: var(--text-muted); text-align: center; border-right: 1px solid rgba(255,255,255,0.05); }
        .ft-btn { flex: 1; padding: 12px; font-size: 0.8rem; font-family: var(--font-head); font-weight: bold; color: white; text-align: center; background: rgba(255,255,255,0.05); cursor: pointer;}

        /* --- SKELETON LOADERS --- */
        .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.02) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.02) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite linear; border-radius: 12px;}
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* --- MENISCUS iOS DOCK --- */
        .ios-dock-wrapper {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 30px); max-width: 420px; z-index: 9000;
        }
        .ios-dock {
            background: rgba(14, 18, 30, 0.95); backdrop-filter: blur(25px);
            border: 1px solid rgba(0, 242, 255, 0.15); border-radius: 40px; padding: 6px 10px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8); position: relative; isolation: isolate;
        }
        .meniscus-bead {
            position: absolute; top: 50%; left: 0; transform: translateY(-50%);
            width: 40px; height: 40px; background: var(--neon-cyan); border-radius: 50%;
            box-shadow: 0 0 15px var(--neon-cyan); z-index: -1; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0;
        }
        .dock-btn {
            display: flex; align-items: center; justify-content: center;
            width: 48px; height: 40px; color: var(--text-muted);
            font-size: 1.1rem; transition: 0.3s; position: relative; z-index: 1; cursor: pointer;
        }
        .dock-btn.active { color: #000; }
        .dock-fab {
            width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan));
            color: white; display: flex; align-items: center; justify-content: center; font-size: 1.4rem;
            box-shadow: 0 5px 15px rgba(0, 242, 255, 0.4); transform: translateY(-12px); cursor: pointer; border: 3px solid var(--bg-void);
        }

        /* --- BOTTOM SHEET MENU --- */
        .bottom-sheet-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 10001; display: none; opacity: 0; transition: 0.3s; }
        .bottom-sheet-overlay.active { display: block; opacity: 1; }
        .bottom-sheet { position: fixed; bottom: -100%; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--panel-glass-solid); border-top: 1px solid var(--neon-cyan); border-radius: 30px 30px 0 0; padding: 20px 20px 40px; z-index: 10002; transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 -10px 40px rgba(0,0,0,0.8); }
        .bottom-sheet.active { bottom: 0; }
        .sheet-handle { width: 40px; height: 5px; background: rgba(255,255,255,0.2); border-radius: 10px; margin: 0 auto 20px; }
        .sheet-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .sheet-item { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--text-main); text-decoration: none; font-size: 0.7rem; font-weight: 700; background: rgba(0,0,0,0.4); border: 1px solid var(--panel-border); padding: 15px 5px; border-radius: 14px; cursor: pointer; }

        /* --- MODALS & TOAST --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); z-index: 10005; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .system-modal { width: 100%; max-width: 400px; background: var(--panel-bg); border: 1px solid var(--neon-cyan); border-radius: 20px; padding: 25px; text-align: center; position: relative; }
        .modal-close { position: absolute; top: 15px; right: 15px; font-size: 1.2rem; color: var(--text-muted); cursor: pointer; }
        
        #toast { position: fixed; top: 20px; right: 20px; background: var(--panel-bg); border: 1px solid var(--neon-cyan); color: white; padding: 12px 20px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; transform: translateX(150%); transition: 0.4s ease; z-index: 99999; }
        #toast.show { transform: translateX(0); }
    </style>
</head>
<body>

    <div class="ambient-bg"><div class="grid-layer"></div><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
    
    <div id="toast"><i class="fa-solid fa-bell" style="color:var(--neon-cyan); margin-right:8px;"></i> <span id="toastMsg">Notification</span></div>

    <!-- MAIN APP CONTAINER -->
    <div class="app-container" id="mainApp">
        
        <!-- UI SAMPLE: TOP CONTROL MATRIX -->
        <div class="top-nav-matrix">
            <div class="nav-row">
                <div class="pill-btn menu" onclick="toggleBottomSheet()"><i class="fa-solid fa-bars"></i></div>
                <div class="pill-btn search" onclick="showToast('Search DB Offline')"><i class="fa-solid fa-magnifying-glass"></i></div>
                <div class="currency-pill tickets"><i class="fa-solid fa-ticket" style="color:var(--neon-cyan);"></i> <span id="valTickets">--</span> +</div>
                <div class="currency-pill gold"><i class="fa-solid fa-coins" style="color:var(--gold);"></i> <span id="valGold">--</span></div>
            </div>
            <div class="nav-row">
                <div class="pill-btn icon-only" style="color:var(--neon-pink);"><i class="fa-solid fa-gift"></i></div>
                <div class="pill-btn icon-only"><i class="fa-solid fa-cart-shopping"></i><div class="badge">2</div></div>
                <div class="pill-btn icon-only" style="color:var(--gold);"><i class="fa-solid fa-bell"></i></div>
                <div class="profile-pill" onclick="window.location.href='profile.html'">
                    <img src="https://ui-avatars.com/api/?name=P&background=131826&color=fff" id="valAvatar">
                    <div class="profile-text">
                        <b id="valName">Guest</b>
                        <span id="valLevel">Level --</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- THRYL UI: DAILY STREAK -->
        <div class="thryl-streak-card" id="streakWidget">
            <div class="ts-left">
                <h1 id="valStreak">1</h1>
                <span>Day Streak</span>
                <i class="fa-solid fa-fire"></i>
            </div>
            <div class="ts-right">
                <div class="ts-head">
                    <h4>Next Reward</h4>
                    <p>Come back tomorrow for more Tickets!</p>
                </div>
                <div class="ts-timeline" id="streakTimeline">
                    <div class="ts-line-bg"></div>
                    <div class="ts-line-fill" id="streakFill"></div>
                    <!-- Nodes injected via JS -->
                </div>
            </div>
        </div>

        <!-- THRYL UI: CASUAL GAMES -->
        <div class="section-header">
            <h2>Casual Games</h2>
            <a href="explore.html">View All</a>
        </div>
        <div class="card-slider" id="gamesSlider">
            <!-- Skeleton Fallbacks -->
            <div class="game-card skeleton"></div>
            <div class="game-card skeleton"></div>
        </div>

        <!-- THRYL UI: FEATURED TOURNAMENTS -->
        <div class="section-header">
            <h2>Featured Tournaments</h2>
            <a href="explore.html">View All</a>
        </div>
        <div class="card-slider" id="tourneySlider">
            <!-- Skeleton Fallbacks -->
            <div class="ft-card skeleton" style="height: 180px;"></div>
        </div>

    </div>

    <!-- iOS MENISCUS DOCK -->
    <div class="ios-dock-wrapper">
        <nav class="ios-dock" id="mobileDock">
            <div class="meniscus-bead" id="dockBead"></div>
            <div class="dock-btn active" onclick="moveBead(0, this)"><i class="fa-solid fa-house"></i></div>
            <div class="dock-btn" onclick="moveBead(1, this); window.location.href='explore.html'"><i class="fa-solid fa-compass"></i></div>
            
            <!-- Center FAB -->
            <div class="dock-fab" onclick="window.location.href='tournament.html'"><i class="fa-solid fa-plus"></i></div>
            
            <div class="dock-btn" onclick="moveBead(2, this); window.location.href='matches.html'"><i class="fa-solid fa-trophy"></i></div>
            <div class="dock-btn" onclick="toggleBottomSheet(); moveBead(3, this)"><i class="fa-solid fa-bars"></i></div>
        </nav>
    </div>

    <!-- BOTTOM SHEET MENU -->
    <div class="bottom-sheet-overlay" id="bottomSheetOverlay" onclick="toggleBottomSheet()"></div>
    <div class="bottom-sheet" id="bottomSheet">
        <div class="sheet-handle"></div>
        <div class="sheet-grid">
            <div class="sheet-item" onclick="window.location.href='profile.html'"><i class="fa-solid fa-user"></i> Profile</div>
            <div class="sheet-item" onclick="window.location.href='clans.html'"><i class="fa-solid fa-shield"></i> Clans</div>
            <div class="sheet-item" onclick="window.location.href='leaderboard.html'"><i class="fa-solid fa-chart-simple"></i> Rank</div>
            <div class="sheet-item" onclick="window.location.href='giveaway.html'"><i class="fa-solid fa-gift"></i> Giveaway</div>
            <div class="sheet-item" onclick="window.location.href='offerwall.html'"><i class="fa-solid fa-coins"></i> Offerwall</div>
            <div class="sheet-item" onclick="openModal('spinModal'); toggleBottomSheet();"><i class="fa-solid fa-dharmachakra"></i> Lucky Spin</div>
            <div class="sheet-item" onclick="openModal('aiModal'); toggleBottomSheet();"><i class="fa-solid fa-robot"></i> Vision AI</div>
        </div>
    </div>

    <!-- MODALS -->
    <div id="aiModal" class="modal-overlay" onclick="closeModal('aiModal')">
        <div class="system-modal" onclick="event.stopPropagation()">
            <span class="modal-close" onclick="closeModal('aiModal')">&times;</span>
            <h2 style="font-family:var(--font-head); color:var(--neon-cyan); margin-bottom:15px;"><i class="fa-solid fa-robot"></i> VISION AI</h2>
            <div id="aiResponseText" style="font-size:0.85rem; color:#ddd; padding:15px; border-radius:12px; border:1px solid rgba(0,242,255,0.2);">
                <i class="fa-solid fa-spinner fa-spin"></i> Analyzing Combat Matrix...
            </div>
        </div>
    </div>

    <div id="spinModal" class="modal-overlay" onclick="closeModal('spinModal')">
        <div class="system-modal" onclick="event.stopPropagation()">
            <span class="modal-close" onclick="closeModal('spinModal')">&times;</span>
            <h2 style="font-family:var(--font-head); color:var(--gold); margin-bottom:15px;"><i class="fa-solid fa-dharmachakra"></i> REWARD NODE</h2>
            <div id="spinWheel" style="width:120px; height:120px; border-radius:50%; border:4px dashed var(--neon-cyan); margin:20px auto; display:flex; align-items:center; justify-content:center; font-size:2rem; color:var(--gold);"><i class="fa-solid fa-gift"></i></div>
            <button style="width:100%; padding:12px; background:var(--gold); border:none; border-radius:10px; font-weight:bold; cursor:pointer;" onclick="triggerSpin()">SPIN FOR 100 GOLD</button>
        </div>
    </div>

    <!-- SUPABASE ENGINE & JS LOGIC -->
    <script>
        // --- 1. Supabase Initialization (Failsafe) ---
        const supabaseUrl = 'https://zuatrwfrejnwfnldqqgy.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp1YXRyd2ZyZWpud2ZubGRxcWd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwNDE5NjEsImV4cCI6MjA5OTYxNzk2MX0.zcJO4Es-DnuUKR-L_Eu44xIwmz4PxsFVCgs-t492t1g'; 
        let supabase = null;
        try { if(window.supabase) supabase = window.supabase.createClient(supabaseUrl, supabaseKey); } 
        catch(e) { console.warn("Supabase Offline. Using Local Mock."); }

        // Core State
        let playerState = { streak: 1, gold: 0, tickets: 0, xp: 0 };

        // --- 2. Boot Sequence ---
        window.addEventListener('DOMContentLoaded', () => {
            initMeniscusDock();
            
            let user = null;
            try { user = JSON.parse(localStorage.getItem('tournyx_user')); } catch(e){}

            if(user) {
                document.getElementById('valName').innerText = user.username || "Player";
                document.getElementById('valAvatar').src = user.avatar || `https://ui-avatars.com/api/?name=${user.username || 'P'}&background=131826&color=fff`;
                if(supabase && user.email) fetchSupabaseUser(user.email);
                else simulateDataLoad();
            } else {
                document.getElementById('valName').innerText = "Guest";
                simulateDataLoad(); // Load mock data for guests
            }

            fetchSupabaseGames();
        });

        // --- 3. Supabase Fetchers ---
        async function fetchSupabaseUser(email) {
            try {
                const { data, error } = await supabase.from('tims_users').select('*').eq('email', email).single();
                if (data) {
                    playerState.streak = data.current_streak || 1;
                    playerState.gold = data.gold || 0;
                    playerState.tickets = data.passes || 0; // Using passes as tickets
                    playerState.xp = data.points || 0;
                }
                updateTopUI();
            } catch(e) { simulateDataLoad(); }
        }

        async function fetchSupabaseGames() {
            try {
                // Fetch mock/real tournaments & games
                renderThrylGames();
                renderThrylTournaments();
            } catch(e) {}
        }

        function simulateDataLoad() {
            playerState = { streak: 3, gold: 12450, tickets: 5000, xp: 45000 };
            updateTopUI();
        }

        // --- 4. UI Updaters ---
        function updateTopUI() {
            // Format Numbers (e.g. 12450 -> 12.4K)
            const formatNum = (num) => num > 9999 ? (num/1000).toFixed(1) + 'K' : num;
            
            document.getElementById('valGold').innerText = formatNum(playerState.gold);
            document.getElementById('valTickets').innerText = formatNum(playerState.tickets);
            document.getElementById('valLevel').innerText = "Level " + (Math.floor(playerState.xp / 1000) + 1);
            
            buildStreakTimeline();
        }

        function buildStreakTimeline() {
            document.getElementById('valStreak').innerText = playerState.streak;
            const timeline = document.getElementById('streakTimeline');
            timeline.querySelectorAll('.ts-node').forEach(e => e.remove());
            
            const totalDays = 6;
            const fillPct = playerState.streak > 0 ? ((playerState.streak - 1) / (totalDays - 1)) * 100 : 0;
            document.getElementById('streakFill').style.width = `${fillPct}%`;

            for(let i=1; i<=totalDays; i++) {
                let sClass = ""; let icon = ""; let amt = i >= 3 ? 15 : 5;
                if(i < playerState.streak) { sClass = "claimed"; icon = `<i class="fa-solid fa-check"></i>`; }
                else if(i === playerState.streak) { sClass = "active"; icon = `<i class="fa-solid fa-fire"></i>`; }

                timeline.insertAdjacentHTML('beforeend', `
                    <div class="ts-node ${sClass}">
                        <div class="ts-circle">${icon}</div>
                        <div class="ts-val"><b><i class="fa-solid fa-ticket" style="color:var(--neon-cyan);"></i> ${amt}</b><span>Day ${i}</span></div>
                    </div>
                `);
            }
        }

        // --- 5. Thryl Card Renderers ---
        function renderThrylGames() {
            const slider = document.getElementById('gamesSlider');
            slider.innerHTML = `
                <div class="game-card" onclick="showToast('Launching Game...')">
                    <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjN9Y3e2eA-4H2K2S7I9-e0Y9wY9X9y_L9a2W0P_J0aX2V9c0L_2J9J_zX9x9c0L_2J9J_zX9x9c0L_2J9J_zX9x9/s800/bgmi.jpg" class="gc-bg">
                    <div class="gc-overlay"></div>
                    <div class="gc-content">
                        <div class="gc-top">
                            <div><div class="gc-title">BGMI Scrims</div><div class="gc-players"><i class="fa-solid fa-users"></i> 688+</div></div>
                            <div class="gc-share"><i class="fa-solid fa-share"></i></div>
                        </div>
                        <div class="gc-bottom">
                            <div class="gc-stat"><span>Prize Pool</span><b><i class="fa-solid fa-ticket" style="color:var(--neon-cyan);"></i> 20,000</b></div>
                            <div class="gc-stat" style="align-items:flex-end;"><span>Resets In</span><b><i class="fa-regular fa-clock"></i> 09:33:02</b></div>
                        </div>
                    </div>
                </div>
                <div class="game-card" onclick="showToast('Launching Game...')">
                    <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgPWb1TYVY631LdM7_7wokoN6duPFimjq9b8aQu-fMRFfr_ZVJYwGWZv1qRswdGGD5eJ6zteK3be6JnC0D18-MkMHgq7Rc-R3ZFYJHyUSc1J1kzSMHyakXC_zEkXXugbpfLQTq9Hyx2LSZndRNgBJTKmdBGdqThUBChB-XlGdzGHFK1eIk3efwQRgQ2glw/s800/1000112605.gif" class="gc-bg">
                    <div class="gc-overlay"></div>
                    <div class="gc-content">
                        <div class="gc-top">
                            <div><div class="gc-title">Free Fire Clash</div><div class="gc-players"><i class="fa-solid fa-users"></i> 284+</div></div>
                            <div class="gc-share"><i class="fa-solid fa-share"></i></div>
                        </div>
                        <div class="gc-bottom">
                            <div class="gc-stat"><span>Prize Pool</span><b><i class="fa-solid fa-ticket" style="color:var(--neon-cyan);"></i> 15,000</b></div>
                            <div class="gc-stat" style="align-items:flex-end;"><span>Resets In</span><b><i class="fa-regular fa-clock"></i> 04:12:45</b></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderThrylTournaments() {
            const slider = document.getElementById('tourneySlider');
            slider.innerHTML = `
                <div class="ft-card">
                    <div class="ft-top">
                        <div class="ft-prize-badge"><i class="fa-solid fa-trophy"></i> ₹ 600</div>
                        <div class="ft-title">Daily Play & Win Scrims D 111</div>
                        <div class="ft-org"><img src="https://ui-avatars.com/api/?name=G&background=fff&color=000"> Glazer Games</div>
                        <div class="ft-tags"><span>Squad</span> | <span>5th Aug 2026</span> | <span>Free Fire Max</span></div>
                    </div>
                    <img src="https://via.placeholder.com/150/131826/00f2ff?text=Tournament" class="ft-art">
                    <div class="ft-bottom">
                        <div class="ft-status">Registration Closed</div>
                        <div class="ft-btn" onclick="window.location.href='explore.html'">View Details</div>
                    </div>
                </div>
            `;
        }

        // --- 6. Interactions & Docks ---
        function initMeniscusDock() {
            const firstBtn = document.querySelector('.dock-btn.active');
            if(firstBtn) moveBead(0, firstBtn);
        }

        function moveBead(index, el) {
            if(navigator.vibrate) navigator.vibrate(10);
            const dock = document.getElementById('mobileDock');
            const bead = document.getElementById('dockBead');
            if(!dock || !bead || !el) return;
            const dockRect = dock.getBoundingClientRect();
            const elRect = el.getBoundingClientRect();
            const offsetLeft = (elRect.left - dockRect.left) + (elRect.width / 2) - (40 / 2);
            bead.style.opacity = '1';
            bead.style.transform = `translate(${offsetLeft}px, -50%)`;
            document.querySelectorAll('.dock-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        function toggleBottomSheet() {
            if(navigator.vibrate) navigator.vibrate(15);
            document.getElementById('bottomSheet').classList.toggle('active');
            document.getElementById('bottomSheetOverlay').classList.toggle('active');
        }

        function openModal(id) {
            if(navigator.vibrate) navigator.vibrate(15);
            document.getElementById(id).classList.add('active');
            if(id === 'aiModal') {
                setTimeout(() => { document.getElementById('aiResponseText').innerHTML = "<b>Agent Online.</b><br>Your gameplay patterns indicate high tactical awareness. Next recommended event: Daily Scrims."; }, 1500);
            }
        }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function triggerSpin() {
            if(playerState.gold < 100) return showToast("Not enough Gold!");
            if(navigator.vibrate) navigator.vibrate(30);
            playerState.gold -= 100; updateTopUI();
            const wheel = document.getElementById('spinWheel');
            wheel.style.transition = "transform 2s cubic-bezier(0.175, 0.885, 0.32, 1.275)";
            wheel.style.transform = `rotate(${1080 + Math.floor(Math.random() * 360)}deg)`;
            setTimeout(() => {
                playerState.gold += 500; updateTopUI();
                showToast("Node Unlocked: +500 Gold!");
                wheel.style.transition = "none"; wheel.style.transform = "rotate(0deg)";
                closeModal('spinModal');
            }, 2100);
        }
    </script>
</body>
